plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.keywordalert'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.keywordalert'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
