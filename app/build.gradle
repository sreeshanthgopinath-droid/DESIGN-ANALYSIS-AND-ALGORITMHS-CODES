plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.keywordalert'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.keywordalert'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // Fixed key so future versions install over this one.
    signingConfigs {
        shared {
            storeFile file('quizalert.keystore')
            storePassword 'quizalert'
            keyAlias 'quizalert'
            keyPassword 'quizalert'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
