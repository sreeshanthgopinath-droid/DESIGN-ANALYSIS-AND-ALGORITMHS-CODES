name: Debug APK

# Builds PhoneCaptureTracker's debug APK on GitHub's runners (which can reach Google's Android
# repositories) and uploads it as a downloadable artifact named PhoneCaptureTracker-debug-apk.

on:
  push:
    branches: [ccr-a4df9c21-szegdu]
    paths:
      - "PhoneCaptureTracker/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (API 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        working-directory: PhoneCaptureTracker
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCaptureTracker-debug-apk
          path: PhoneCaptureTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
