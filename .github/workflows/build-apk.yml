name: Build Mythos Tracker APK

on:
  push:
    branches: [mythos-tracker-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Save results to a branch
        if: always()
        run: |
          mkdir out
          cp build.log out/ || true
          cp app/build/outputs/apk/debug/app-debug.apk out/MythosTracker.apk || true
          cd out && git init -q -b mythos-tracker-apk && git add .
          git -c user.name=ci -c user.email=ci@example.com commit -qm "build output"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mythos-tracker-apk
